# ------------------------------------------------------------------------------
# БЛОК 1: Автоматический запуск unit-тестов ADY Calculator
# ------------------------------------------------------------------------------
name: ADY Calculator Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Чек-аут репозитория
      uses: actions/checkout@v4

    - name: Настройка Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Установка зависимостей
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Запуск тестов NLU-парсера и маршрутизатора
      run: |
        pytest tests/ -v
